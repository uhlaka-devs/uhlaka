name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The store is tested on every database it supports (ADR 0013).
      - name: Start Postgres and MySQL
        run: |
          docker run -d --name pg -e POSTGRES_USER=uhlaka -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=uhlaka -p 5432:5432 postgres:16 -c max_connections=300
          docker run -d --name my -e MYSQL_ROOT_PASSWORD=pw -e MYSQL_DATABASE=uhlaka -e MYSQL_USER=uhlaka -e MYSQL_PASSWORD=pw -p 3306:3306 mysql:8.4 --mysql-native-password=ON --authentication-policy=mysql_native_password
          for i in $(seq 1 90); do
            docker exec my mysqladmin ping -h127.0.0.1 -uuhlaka -ppw >/dev/null 2>&1 && docker exec pg pg_isready -h 127.0.0.1 -U uhlaka >/dev/null 2>&1 && exit 0
            sleep 2
          done
          exit 1
      # Coverage is counted from the unit tests here and from the browser in the end-to-end tests below (tools/coverage.ts).
      - run: bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage
        env:
          UHLAKA_TEST_POSTGRES: postgres://uhlaka:pw@127.0.0.1:5432/uhlaka
          UHLAKA_TEST_MYSQL: mysql://uhlaka:pw@127.0.0.1:3306/uhlaka
      # The command people run, on a real file, checked by what it wrote.
      - name: Export the sample site
        run: |
          bun run cms init "$RUNNER_TEMP/site.db"
          bun run cms export "$RUNNER_TEMP/site.db" "$RUNNER_TEMP/out"
          grep -q '<h1>Solid wood furniture, made to measure</h1>' "$RUNNER_TEMP/out/index.html"
          grep -q -- '--t-color-primary:#2563eb' "$RUNNER_TEMP/out/assets/site.css"
          test -f "$RUNNER_TEMP/out/about/index.html"
      # A WordPress export brought in and published, checked by the files.
      - name: Import a WordPress export
        run: |
          bun run cms import "$RUNNER_TEMP/wp.db" test/fixtures/wordpress.xml --no-images
          bun run cms export "$RUNNER_TEMP/wp.db" "$RUNNER_TEMP/wp"
          grep -q 'First <strong>post</strong>' "$RUNNER_TEMP/wp/blog/hello-world/index.html"
          grep -q 'url=/blog/hello-world/' "$RUNNER_TEMP/wp/2024/01/hello-world/index.html"
      # The content in one file, brought into a new site, published the same (ADR 0057).
      - name: Export the content and bring it back
        run: |
          bun run cms export "$RUNNER_TEMP/site.db" "$RUNNER_TEMP/site.uhlaka.json"
          bun run cms import "$RUNNER_TEMP/copy.db" "$RUNNER_TEMP/site.uhlaka.json"
          bun run cms export "$RUNNER_TEMP/copy.db" "$RUNNER_TEMP/copy"
          diff -r --exclude=.uhlaka-export "$RUNNER_TEMP/out" "$RUNNER_TEMP/copy"
          grep -q '"title": "About"' "$RUNNER_TEMP/copy/about/index.json"
      # The editor in a real browser, from the first click to the exported files.
      - name: Editor end to end
        env:
          UHLAKA_COVERAGE: coverage
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          node e2e/editor.cjs
          node e2e/import.cjs
          node e2e/templates.cjs
          node e2e/forms.cjs
          node e2e/admin.cjs
          node e2e/accounts.cjs
          node e2e/translations.cjs
          node e2e/extensions.cjs
          node e2e/sections.cjs
          node e2e/redirects.cjs
          node e2e/media-blocks.cjs
          node e2e/seo.cjs
          node e2e/seo-more.cjs
          node e2e/structured-data.cjs
          node e2e/not-found.cjs
          node e2e/seo-tools.cjs
          node e2e/visitors.cjs
          node e2e/backups.cjs
          node e2e/relations.cjs
          node e2e/stats.cjs
          node e2e/entry-languages.cjs
          node e2e/authors.cjs
          node e2e/archives.cjs
          node e2e/export.cjs
          node e2e/shop.cjs
          node e2e/dark-mode.cjs
          node e2e/palettes.cjs
          node e2e/admin-bar.cjs
      # The whole source tree, both kinds of test together. Below the floor, or a file no test measures, fails the build.
      - name: Coverage
        shell: bash
        run: bun run coverage | tee coverage/summary.txt
      - name: Coverage summary
        if: always()
        run: test -f coverage/summary.txt && { echo '```'; tail -1 coverage/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage/all.lcov
            coverage/summary.txt
          if-no-files-found: ignore
